name: Deploy ODR to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: vps-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend & Frontend to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo ">>> Navigating to /var/www/ODR..."
            cd /var/www/ODR

            echo ">>> Force-syncing repository to latest origin/main..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env -e "**/.*env*" -e "**/dist"

            echo ">>> Setting up backend environment (.env)..."
            cd /var/www/ODR/backend
            echo "" | base64 -d > .env
            sed -i 's/\r$//' .env
            cp .env /var/www/ODR/.env
            cp .env /var/www/ODR_backend_env_backup

            echo ">>> Installing backend dependencies..."
            npm install

            echo ">>> Setting up frontend environment (.env)..."
            cd /var/www/ODR/frontend
            cat << 'EOF' > .env
            VITE_API_BASE_URL=https://gokulanandachaudhurifoundation.com
            VITE_FIREBASE_API_KEY=AIzaSyAurz8Xb77hEkG_HsZ_xhkxpTXTAIkJtCw
            VITE_FIREBASE_AUTH_DOMAIN=odr-project-e9661.firebaseapp.com
            VITE_FIREBASE_PROJECT_ID=odr-project-e9661
            VITE_FIREBASE_STORAGE_BUCKET=odr-project-e9661.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID=787835897809
            VITE_FIREBASE_APP_ID=1:787835897809:web:3575c48a250f20ccecc2f0
            VITE_RECAPTCHA_SITE_KEY=6LdCfNktAAAAADAXNOqot87Dc45amIz4FOtKTW9p
            EOF
            sed -i 's/^[[:space:]]*//' .env
            sed -i 's/\r$//' .env

            echo ">>> Installing frontend dependencies and building production bundle..."
            npm install
            npm run build

            echo ">>> Starting/Restarting backend service with PM2..."
            cd /var/www/ODR/backend
            pm2 delete odr-backend || true
            pm2 start app.js --name odr-backend --update-env
            pm2 save

            echo ">>> Verifying backend status..."
            sleep 3
            pm2 status
            pm2 logs odr-backend --lines 20 --nostream

            echo ">>> Testing local backend responsiveness..."
            curl -I http://127.0.0.1:3636/ || true
            curl -I http://localhost:3636/ || true

            echo ">>> Aligning Nginx proxy port for gokulanandachaudhurifoundation.com to 3636..."
            sudo grep -rn "gokulanandachaudhurifoundation.com" /etc/nginx/sites-enabled/ /etc/nginx/sites-available/ || true
            sudo sed -i 's/localhost:3010/localhost:3636/g' /etc/nginx/sites-enabled/* /etc/nginx/sites-available/* || true
            sudo sed -i 's/127.0.0.1:3010/127.0.0.1:3636/g' /etc/nginx/sites-enabled/* /etc/nginx/sites-available/* || true
            sudo nginx -t
            sudo systemctl reload nginx || sudo nginx -s reload || true

            echo ">>> Testing public domain response from VPS..."
            curl -I https://gokulanandachaudhurifoundation.com/ || true

            echo ">>> Deployment successfully completed!"
